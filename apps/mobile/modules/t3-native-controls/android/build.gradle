apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.t3tools.nativecontrols'
version = '0.0.0'

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  // ViewCode keeps its own navigation and does not register these upstream modules.
  exclude('**/T3WorkspaceNavigationModule.kt', '**/T3FoldPostureModule.kt')
}

android {
  namespace 'expo.modules.t3nativecontrols'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
  }
}

dependencies {
  implementation project(':expo-modules-core')
}
